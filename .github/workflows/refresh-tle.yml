name: Refresh satellite TLEs

# CelesTrak needs no API key. Once a day is polite and keeps positions accurate.
on:
  schedule:
    - cron: '30 1 * * *'     # 07:00 IST daily
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify TLE refresh files
        run: |
          test -f VaanEye/scripts/refresh_tle.py
          test -d VaanEye/site

      - name: Fetch latest TLEs from CelesTrak
        run: python3 VaanEye/scripts/refresh_tle.py

      - name: Commit if changed
        run: |
          git config user.name "vaaneye-bot"
          git config user.email "actions@github.com"
          git add VaanEye/site/sats.json VaanEye/site/satmeta.json
          if git diff --staged --quiet; then
            echo "No TLE changes detected"
          else
            git commit -m "chore: refresh TLEs $(date -u +%Y-%m-%d)"
            git push
          fi
