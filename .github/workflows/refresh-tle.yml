name: Refresh satellite TLEs

# CelesTrak needs no API key. Once a day is polite and keeps positions accurate.
on:
  schedule:
    - cron: '30 1 * * *'     # 07:00 IST daily
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The deployed app and refresh script are in this directory. The old
      # workflow used VaanEye/scripts and VaanEye/site, which do not exist.
      - name: Verify TLE refresh files
        shell: bash
        run: |
          set -euxo pipefail
          APP_DIR='VaanEye Arena AI New New'
          test -f "$APP_DIR/scripts/refresh_tle.py"
          test -d "$APP_DIR/site"

      - name: Fetch latest TLEs from CelesTrak
        shell: bash
        run: |
          set -euxo pipefail
          python -u 'VaanEye Arena AI New New/scripts/refresh_tle.py'

      - name: Commit if changed
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "vaaneye-bot"
          git config user.email "actions@github.com"
          git add -- 'VaanEye Arena AI New New/site/sats.json' 'VaanEye Arena AI New New/site/satmeta.json'
          if git diff --staged --quiet; then
            echo "No TLE changes detected"
          else
            git commit -m "chore: refresh TLEs $(date -u +%Y-%m-%d)"
            git push
          fi
